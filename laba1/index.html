<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Учет студентов общежития</title>
  <link rel="icon" type="image/jpeg" href="assets/user-favicon.jpg">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="app-header">
    <div class="brand">
      <img class="brand-mark" src="assets/user-favicon.jpg" alt="">
      <div>
        <h1>Учет студентов общежития</h1>
        <p>Список, форма и досье студента</p>
      </div>
    </div>
    <nav class="header-actions" aria-label="Навигация">
      <button class="toolbar-button is-active" type="button" id="showListButton">
        <span aria-hidden="true">≡</span>
        <span>Список</span>
      </button>
      <button class="toolbar-button primary" type="button" id="addStudentButton">
        <span aria-hidden="true">+</span>
        <span>Добавить</span>
      </button>
    </nav>
  </header>

  <main class="app-shell">
    <section class="screen is-visible" id="studentsScreen" aria-labelledby="studentsTitle">
      <div class="section-header">
        <div>
          <h2 id="studentsTitle">Студенты</h2>
          <p id="studentsCount">0 записей</p>
        </div>
        <label class="search-field">
          <span class="visually-hidden">Поиск студента</span>
          <input type="search" id="studentSearch" placeholder="Поиск по ФИО, группе, комнате">
        </label>
      </div>

      <div class="table-wrap">
        <table class="students-table">
          <thead>
            <tr>
              <th>ФИО</th>
              <th>Группа</th>
              <th>ИСУ ID</th>
              <th>Общежитие</th>
              <th>Комната</th>
              <th>Заселение до</th>
              <th>Статус</th>
              <th class="actions-heading">Действия</th>
            </tr>
          </thead>
          <tbody id="studentsTableBody"></tbody>
        </table>
      </div>
      <div class="empty-state" id="emptyState" hidden>
        <h3>Записей нет</h3>
        <p>Добавьте первого студента через форму.</p>
      </div>
    </section>

    <section class="screen" id="formScreen" aria-labelledby="formTitle">
      <div class="section-header">
        <div>
          <h2 id="formTitle">Добавить студента</h2>
          <p id="formModeLabel">Новая запись в журнале общежития</p>
        </div>
      </div>

      <form class="student-form" id="studentForm" novalidate>
        <input type="hidden" id="studentId" name="studentId">

        <div class="form-grid">
          <label class="field">
            <span>ФИО</span>
            <input
              type="text"
              id="fullName"
              name="fullName"
              minlength="5"
              maxlength="80"
              pattern="[A-Za-zА-Яа-яЁё ]{5,80}"
              autocomplete="name"
              required
            >
            <span class="error-message" id="fullNameError"></span>
          </label>

          <label class="field">
            <span>Группа</span>
            <input
              type="text"
              id="group"
              name="group"
              minlength="2"
              maxlength="20"
              pattern="[A-Za-zА-Яа-яЁё0-9 -]{2,20}"
              required
            >
            <span class="error-message" id="groupError"></span>
          </label>

          <label class="field">
            <span>ИСУ ID</span>
            <input
              type="number"
              id="isuId"
              name="isuId"
              min="100000"
              max="999999"
              inputmode="numeric"
              required
            >
            <span class="error-message" id="isuIdError"></span>
          </label>

          <label class="field">
            <span>Номер общежития</span>
            <input
              type="number"
              id="dormNumber"
              name="dormNumber"
              min="1"
              max="20"
              inputmode="numeric"
              required
            >
            <span class="error-message" id="dormNumberError"></span>
          </label>

          <label class="field">
            <span>Комната</span>
            <input
              type="text"
              id="room"
              name="room"
              maxlength="10"
              pattern="[0-9]{1,4}[A-Za-zА-Яа-я]?"
              required
            >
            <span class="error-message" id="roomError"></span>
          </label>

          <label class="field">
            <span>Срок заселения</span>
            <input type="date" id="settlementDate" name="settlementDate" required>
            <span class="error-message" id="settlementDateError"></span>
          </label>
        </div>

        <label class="checkbox-field">
          <input type="checkbox" id="isForeign" name="isForeign">
          <span>Иностранный студент</span>
        </label>

        <label class="field">
          <span>Заметки</span>
          <textarea id="notes" name="notes" maxlength="300" rows="5"></textarea>
          <span class="error-message" id="notesError"></span>
        </label>

        <div class="form-actions">
          <button class="toolbar-button muted" type="button" id="cancelFormButton">
            <span aria-hidden="true">←</span>
            <span>Назад</span>
          </button>
          <button class="toolbar-button primary" type="submit">
            <span aria-hidden="true">✓</span>
            <span>Сохранить</span>
          </button>
        </div>
      </form>
    </section>

    <section class="screen" id="dossierScreen" aria-labelledby="dossierTitle">
      <div class="section-header">
        <div>
          <h2 id="dossierTitle">Досье студента</h2>
          <p>Подробная карточка записи</p>
        </div>
        <button class="toolbar-button muted" type="button" id="backFromDossierButton">
          <span aria-hidden="true">←</span>
          <span>Назад</span>
        </button>
      </div>
      <article class="dossier-card" id="dossierContent"></article>
    </section>
  </main>

  <script src="js/storage.js"></script>
  <script src="js/validation.js"></script>
  <script src="js/navigation.js"></script>
  <script src="js/table.js"></script>
  <script src="js/dossier.js"></script>
  <script src="js/form.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
